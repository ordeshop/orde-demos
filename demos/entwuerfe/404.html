<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nicht gefunden – ORDÉ</title>
<style>
  :root{--ink:#16150F;--muted:#6C665B;--green:#1E3B32;--paper:#FBF9F5;--line:#E6DFD3}
  *{box-sizing:border-box;margin:0}
  body{min-height:100dvh;display:grid;place-items:center;padding:32px 16px;background:var(--paper);color:var(--ink);font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  main{max-width:34em}
  .marke{font-family:Georgia,"Times New Roman",serif;letter-spacing:.35em;font-size:22px;color:var(--green)}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.15;margin:28px 0 16px}
  p{color:var(--muted)}
  .kontakt{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);font-size:15px}
  a{color:var(--green);font-weight:600;text-underline-offset:3px}
  a:focus-visible{outline:2px solid var(--green);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="marke">ORDÉ</p>
  <h1>Diese Vorschau gibt es nicht</h1>
  <p>Der Link ist falsch geschrieben oder die Vorschau wurde inzwischen entfernt. Schreiben Sie uns gern, dann schicken wir Ihnen den aktuellen Link.</p>
  <p class="kontakt"><a href="mailto:hello@byorde.com">hello@byorde.com</a> · <a href="https://byorde.com">byorde.com</a></p>
</main>
</body>
</html>
