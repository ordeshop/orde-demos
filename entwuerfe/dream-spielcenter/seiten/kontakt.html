<!-- titel: Kontakt | beschreibung: Kontakt zum Dream Spielcenter: Telefon, E-Mail und Kontaktformular. | nav: kontakt -->
  <div class="phero">
    <div class="rays" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div>
    <div class="wrap">
      <ol class="crumbs h-a"><li><a href="index.html">Start</a></li><li aria-current="page">Kontakt</li></ol>
      <h1 class="h-a">Schreiben <span>Sie uns.</span></h1>
      <p class="intro h-a">Fragen, Lob oder Kritik? Wir antworten so schnell wie möglich.</p>
    </div>
  </div>

  <section aria-label="Kontaktmöglichkeiten und Formular">
    <div class="wrap contact">
      <div class="rv">
        <p class="kicker">Direkt</p>
        <h2>So erreichen<br>Sie uns.</h2>
        <div class="channels">
          <a href="#"><i class="ti ti-phone" aria-hidden="true"></i><span><small>Telefon</small>Nummer ergänzen</span></a>
          <a href="#"><i class="ti ti-mail" aria-hidden="true"></i><span><small>E-Mail</small>Adresse ergänzen</span></a>
          <a href="standorte.html"><i class="ti ti-map-pin" aria-hidden="true"></i><span><small>Vor Ort</small>Alle Standorte ansehen</span></a>
        </div>
      </div>
      <form class="rv" action="#" data-demo>
        <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="f-mail">E-Mail</label><input id="f-mail" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="f-topic">Anliegen</label>
          <select id="f-topic" name="topic"><option>Allgemeine Frage</option><option>Feedback</option><option>Spielerschutz</option></select></div>
        <div class="field"><label for="f-ort">Standort</label>
          <select id="f-ort" name="ort"><option>Kaufering</option><option>Allgemein</option></select></div>
        <div class="field full"><label for="f-msg">Nachricht</label><textarea id="f-msg" name="message" required></textarea></div>
        <label class="consent"><input type="checkbox" required> Ich bin einverstanden, dass meine Angaben zur Bearbeitung meiner Anfrage verwendet werden (siehe <a href="datenschutz.html" style="text-decoration:underline">Datenschutzerklärung</a>).</label>
        <button class="btn btn-brand" type="submit"><i class="ti ti-send" aria-hidden="true"></i>Nachricht senden</button>
        <p role="status" style="grid-column:1/-1;color:var(--yellow)"></p>
      </form>
    </div>
  </section>

  <section class="locs" aria-label="Bewerbungen" style="padding:72px 0">
    <div class="wrap">
      <div class="hotline" style="margin:0">
        <strong>Sie möchten sich bewerben?</strong>
        <a href="jobs.html#bewerben">Zum Bewerbungsformular</a>
      </div>
    </div>
  </section>
