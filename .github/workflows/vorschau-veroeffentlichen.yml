name: Vorschau veröffentlichen

# Stellt die Kunden-Vorschauen aus demos/entwuerfe/ auf GitHub Pages:
#   https://ordeshop.github.io/orde-demos/<slug>/
#
# Nur dieser Ordner geht online, nicht das restliche Repo.
# Unter Settings -> Pages muss "Source" auf "GitHub Actions" stehen.
# Spaeter moeglich: eigene Adresse vorschau.byorde.com (CNAME bei Hostinger,
# Settings -> Pages -> Custom domain).

on:
  push:
    branches: [main]
    paths:
      - "demos/entwuerfe/**"
      - ".github/workflows/vorschau-veroeffentlichen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vorschau-pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Vorschau-Ordner verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demos/entwuerfe/

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
