name: Demos hochladen

# Laedt die Beispielseiten per FTP nach /demos/ auf den Server.
# Die Kunden-Vorschauen (demos/entwuerfe/) gehen NICHT mit, die laufen
# ueber vorschau-veroeffentlichen.yml auf GitHub Pages.
#
# Getrennt vom Upload der Website: beide schreiben in verschiedene Ordner
# und loeschen nichts voneinander (dangerous-clean-slate steht auf false).
#
# Vorher einrichten unter Settings -> Secrets and variables -> Actions:
#   FTP_SERVER     Serveradresse von Hostinger
#   FTP_USERNAME   FTP-Benutzername der Domain, bei Hostinger u350662327.byorde.com
#                  (nicht nur u350662327). Dieser Zugang startet schon in
#                  public_html von byorde.com, deshalb steht unten ./demos/
#                  und nicht ./public_html/demos/.
#   FTP_PASSWORD   FTP-Passwort
#
# Solange die Secrets fehlen, wird das Hochladen mit einem Hinweis
# uebersprungen statt fehlzuschlagen.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demos-hochladen
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: Pruefen, ob die Zugangsdaten hinterlegt sind
        id: pruefung
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then
            echo "bereit=nein" >> "$GITHUB_OUTPUT"
            echo "::notice::Hochladen uebersprungen - FTP_SERVER ist noch nicht gesetzt."
          else
            echo "bereit=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Beispielseiten hochladen
        if: steps.pruefung.outputs.bereit == 'ja'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./demos/
          server-dir: ./demos/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/*.md
            entwuerfe/**

      - name: Vorschaubilder hochladen
        if: steps.pruefung.outputs.bereit == 'ja'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./vorschau/
          server-dir: ./demos/vorschau/
          dangerous-clean-slate: false
